services:
  workspace:
    image: mcr.microsoft.com/devcontainers/base:ubuntu
    command: sleep infinity
    volumes:
      - ..:/workspaces/${localWorkspaceFolderBasename}:cached
    depends_on:
      database:
        condition: service_healthy
    shm_size: "1gb"
    environment:
      DB_HOST: database
      DB_PORT: "3306"
      DB_DATABASE: uas3
      DB_USER: ventra_local
      DB_PASSWORD: ventra_codespace_only
      DB_URL: jdbc:mysql://database:3306/uas3?serverTimezone=UTC

  database:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: uas3
      MARIADB_USER: ventra_local
      MARIADB_PASSWORD: ventra_codespace_only
      MARIADB_ROOT_PASSWORD: ventra_root_codespace_only
    volumes:
      - ventra-db-data:/var/lib/mysql
      - "../uas3 (6).sql:/docker-entrypoint-initdb.d/01-ventra-dump.sql:ro"
      - "../database/password_hash_migration.sql:/docker-entrypoint-initdb.d/02-password-column.sql:ro"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  ventra-db-data:
