name: Validate Ventra Codespaces setup

on:
  push:
    branches: [main]
    paths:
      - ".devcontainer/**"
      - ".github/workflows/codespaces-validation.yml"
      - "pom.xml"
      - "src/main/java/**"
      - "src/main/resources/**"
      - "uas3 (6).sql"
      - "database/password_hash_migration.sql"
  pull_request:
    branches: [main]
    paths:
      - ".devcontainer/**"
      - ".github/workflows/codespaces-validation.yml"
      - "pom.xml"
      - "src/main/java/**"
      - "src/main/resources/**"
      - "uas3 (6).sql"
      - "database/password_hash_migration.sql"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Validate Codespaces configuration
        run: |
          python3 -c 'import json; json.load(open(".devcontainer/devcontainer.json"))'
          bash -n .devcontainer/start-desktop-app.sh
          localWorkspaceFolderBasename=ventra docker compose -f .devcontainer/docker-compose.yml config -q

      - name: Build original Ventra Swing application
        run: mvn -B -DskipTests package dependency:copy-dependencies

      - name: Restore and check original MariaDB snapshot
        run: |
          export localWorkspaceFolderBasename=ventra
          if ! docker compose -f .devcontainer/docker-compose.yml up -d --wait --wait-timeout 180 database; then
            docker compose -f .devcontainer/docker-compose.yml logs database
            exit 1
          fi
          tables=$(localWorkspaceFolderBasename=ventra docker compose -f .devcontainer/docker-compose.yml exec -T database mariadb -uroot -pventra_root_codespace_only -N -D uas3 -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='uas3'")
          test "$tables" -eq 8
          password_length=$(localWorkspaceFolderBasename=ventra docker compose -f .devcontainer/docker-compose.yml exec -T database mariadb -uroot -pventra_root_codespace_only -N -D uas3 -e "SELECT CHARACTER_MAXIMUM_LENGTH FROM information_schema.columns WHERE table_schema='uas3' AND table_name='user' AND column_name='password'")
          test "$password_length" -eq 255
          inbound_price_column=$(localWorkspaceFolderBasename=ventra docker compose -f .devcontainer/docker-compose.yml exec -T database mariadb -uroot -pventra_root_codespace_only -N -D uas3 -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='uas3' AND table_name='inbound_detail' AND column_name='harga'")
          test "$inbound_price_column" -eq 1

      - name: Stop local services
        if: always()
        run: |
          localWorkspaceFolderBasename=ventra docker compose -f .devcontainer/docker-compose.yml down -v
