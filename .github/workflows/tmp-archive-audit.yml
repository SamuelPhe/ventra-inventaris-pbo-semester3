name: Temporary archive database audit
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-archive-audit.yml"
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect bundled archives without printing account data
        shell: bash
        run: |
          python - <<'PY'
          import io, zipfile, pathlib
          quote_chars = chr(96) + '"'
          def inspect_zip(data, label, depth=0):
              if depth > 3:
                  print("MAX_NESTED_DEPTH", label)
                  return
              try:
                  z = zipfile.ZipFile(io.BytesIO(data))
              except Exception as exc:
                  print("NOT_A_ZIP", label, type(exc).__name__)
                  return
              print("ARCHIVE", label)
              for info in z.infolist():
                  name = info.filename
                  if info.is_dir():
                      continue
                  low = name.lower()
                  print("ENTRY", name, "BYTES", info.file_size)
                  if low.endswith(".sql"):
                      sql = z.read(name).decode("utf-8", "replace")
                      tables, databases, inserts = set(), set(), set()
                      insert_count = 0
                      for line in sql.splitlines():
                          clean = line.strip()
                          upper = clean.upper()
                          if upper.startswith("CREATE TABLE"):
                              parts = clean.replace("(", " ").split()
                              idx = 5 if len(parts) > 5 and parts[1:5] == ["TABLE", "IF", "NOT", "EXISTS"] else 2
                              if len(parts) > idx:
                                  tables.add(parts[idx].strip(quote_chars))
                          elif upper.startswith("CREATE DATABASE"):
                              parts = clean.split()
                              idx = 5 if len(parts) > 5 and parts[1:5] == ["DATABASE", "IF", "NOT", "EXISTS"] else 2
                              if len(parts) > idx:
                                  databases.add(parts[idx].strip(quote_chars))
                          if upper.startswith("INSERT INTO"):
                              parts = clean.split()
                              if len(parts) > 2:
                                  inserts.add(parts[2].strip(quote_chars))
                                  insert_count += 1
                      print("SQL_SUMMARY", name, "DATABASES", sorted(databases), "TABLES", sorted(tables), "INSERT_TABLES", sorted(inserts), "INSERT_STATEMENTS", insert_count)
                  elif low.endswith(".zip"):
                      inspect_zip(z.read(name), label + "!" + name, depth + 1)
          archive = pathlib.Path("UAS_PBO final (1).zip")
          if archive.exists():
              inspect_zip(archive.read_bytes(), str(archive))
          else:
              print("ARCHIVE_MISSING", str(archive))
          PY
