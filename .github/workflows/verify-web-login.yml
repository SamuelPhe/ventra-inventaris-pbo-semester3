name: Verify Ventra web login

on:
  push:
    branches: [main]
    paths:
      - "webapp/**"
      - "src/main/java/PasswordUtil.java"
      - ".github/workflows/verify-web-login.yml"
  pull_request:
    branches: [main]
    paths:
      - "webapp/**"
      - "src/main/java/PasswordUtil.java"
      - ".github/workflows/verify-web-login.yml"

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - name: Check PHP syntax
        run: |
          php -l webapp/config.php
          php -l webapp/index.php

  java-password-util:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile password utility
        run: javac -d "$RUNNER_TEMP/classes" src/main/java/PasswordUtil.java
